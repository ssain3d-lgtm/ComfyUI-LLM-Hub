[project]
name = "comfyui-llm-hub"
description = "Pick an LLM backend (LM Studio / Claude Code / Codex / Gemini) and generate text inside ComfyUI, with a live monitor on the node."
version = "1.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests"]
readme = "README.md"

[project.urls]
Repository = "https://github.com/ssain3d-lgtm/ComfyUI-LLM-Hub"

# pytest 설정을 여기 두면 안 된다 -- tests/pytest.ini 에 있다. 이유는 그 파일에.

[tool.comfy]
# PublisherId 는 Comfy Registry 의 핸들(@ 뒤 문자열)입니다. 보통 GitHub 사용자명과
# 같지만 다를 수 있으니 https://registry.comfy.org 에 로그인해 확인하세요.
# 값이 틀리면 `comfy node publish` 가 거부됩니다.
PublisherId = "ssain3d-lgtm"
DisplayName = "ComfyUI-LLM-Hub"
Icon = "https://raw.githubusercontent.com/ssain3d-lgtm/ComfyUI-LLM-Hub/main/example_workflows/icon.png"
