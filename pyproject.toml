version = "1.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests"]
readme = "README.md"

[project.urls]
Repository = "https://github.com/ssain3d-lgtm/ComfyUI-LLM-Hub"

[tool.comfy]
