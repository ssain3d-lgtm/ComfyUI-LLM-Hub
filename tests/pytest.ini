; pytest 로 이 테스트들을 돌리기 위한 최소 설정.
;
; CI 는 `python -m unittest discover -s tests -p "test_*.py"` 를 쓴다
; (.github/workflows). 그 경로로는 아무 설정도 필요 없다. 이 파일은 손으로
; pytest 를 치는 경우를 위한 것이다.
;
; 두 가지가 필요하다.
;
; 1) 이 파일이 **tests/ 안에** 있어야 한다.
;    pytest 는 설정 파일이 있는 곳을 rootdir 로 잡는다. 팩 루트(pyproject.toml)에
;    두면 rootdir 가 팩 루트가 되고, 그러면 pytest 가 팩의 __init__.py 를
;    `__init__` 이라는 최상위 모듈로 임포트하려 든다. 그 안의
;    `from .nodes import ...` 는 부모 패키지가 없으니 깨진다:
;        ImportError: attempted relative import with no known parent package
;    증상이 "실패 1건" 이 아니라 "305건 전부 collection ERROR" 라 원인이 안 보인다.
;    실측(2026-08-16): 팩 루트에 두면 305 errors, tests/ 에 두면 정상.
;
; 2) import 모드가 importlib 이어야 한다.
;    기본 prepend 모드는 위와 같은 이유로 같은 곳에서 넘어진다. 테스트들은
;    팩을 importlib.import_module("ComfyUI-LLM-Hub.nodes") 로 직접 가져오므로
;    pytest 가 경로를 추측할 이유가 없다.
;
; 실행:  cd tests && python -m pytest -q
; (cd 가 필요한 이유: 테스트들이 서로를 `from mock_lmstudio import ...` 로
;  부르는데, importlib 모드는 sys.path 를 건드리지 않는다. `python -m pytest`
;  가 현재 폴더를 sys.path 에 넣어주는 것에 기댄다.)

[pytest]
addopts = --import-mode=importlib
