name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux is the required job. The suite is written against Linux assumptions.
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; 3.12 is what recent
        # ComfyUI portable builds ship. Testing both catches version drift.
        python-version: ["3.10", "3.12"]
    steps:
      # No `path:` — the workspace folder is already named after the repo, and
      # the tests derive the package name from that folder's basename.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  # Windows matters: it is the platform this pack is actually used on.
  #
  # This job started as `continue-on-error: true` because the README claimed a
  # baseline of three known Windows failures. The first real CI run found two,
  # both assertions expecting "/" as the path separator — the product was
  # right, the tests were Linux-naive. With those fixed the baseline is zero,
  # so this job is now required like the Linux ones. A red Windows job means a
  # real regression.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
