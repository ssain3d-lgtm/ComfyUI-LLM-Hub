name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux is the required job. The suite is written against Linux assumptions.
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; 3.12 is what recent
        # ComfyUI portable builds ship. Testing both catches version drift.
        python-version: ["3.10", "3.12"]
    steps:
      # No `path:` — the workspace folder is already named after the repo, and
      # the tests derive the package name from that folder's basename.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  # Windows is informational only. Three tests fail there for reasons that are
  # not defects: two assert "/" as the path separator when passing media to
  # gemini, one looks for an English string inside a Korean message. Making
  # this job required would paint the repo red for a known, documented
  # baseline — but dropping Windows entirely would hide real regressions on
  # the platform this pack is actually used on.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
